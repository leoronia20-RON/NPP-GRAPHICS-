<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">Request a quote illustration</title>
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b3b5a"/>
      <stop offset="100%" stop-color="#0ea5a1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0%" stop-color="#f2b705"/>
      <stop offset="100%" stop-color="#ffd47a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" rx="40" fill="url(#g1)" opacity="0.06"/>

  <!-- clipboard -->
  <g transform="translate(220,140)">
    <rect x="120" y="60" width="560" height="700" rx="28" fill="#fff" opacity="0.95"/>
    <rect x="240" y="18" width="320" height="120" rx="24" fill="url(#g1)"/>
    <rect x="260" y="52" width="280" height="64" rx="10" fill="#fff" opacity="0.9"/>
    <!-- lines -->
    <g fill="#e6eef2" opacity="0.95">
      <rect x="300" y="150" width="420" height="18" rx="8"/>
      <rect x="300" y="200" width="340" height="14" rx="7"/>
      <rect x="300" y="240" width="380" height="14" rx="7"/>
      <rect x="300" y="280" width="320" height="14" rx="7"/>
    </g>
  </g>

  <!-- pencil -->
  <g transform="translate(640,480) rotate(18)">
    <rect x="0" y="0" width="380" height="48" rx="12" fill="url(#g2)"/>
    <polygon points="380,24 420,0 420,48" fill="#d97706"/>
    <rect x="-14" y="10" width="28" height="28" rx="6" fill="#3b3b3b"/>
  </g>

  <!-- accent circle -->
  <circle cx="980" cy="160" r="92" fill="url(#g2)" opacity="0.12"/>

</svg>
